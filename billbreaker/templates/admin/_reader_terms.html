{# The reader's answers on the left, the search terms they expand to on the right. #}
<div class="grid gap-8 md:grid-cols-12">
  <dl class="space-y-2 text-sm md:col-span-5">
    {% for k, v in profile.items() %}
    <div class="flex gap-3"><dt class="w-24 shrink-0 text-[10px] uppercase tracking-[0.25em] text-muted-foreground">{{ k }}</dt><dd>{{ v }}</dd></div>
    {% else %}
    <p class="text-muted-foreground">No answers; the general summary is all they get.</p>
    {% endfor %}
  </dl>
  <div class="md:col-span-7">
    <div class="text-[10px] uppercase tracking-[0.25em] text-muted-foreground">{{ terms | length }} terms searched for</div>
    <div class="mt-3 flex flex-wrap gap-1.5">
      {% for t in terms %}<span class="border border-border px-2 py-1 text-xs">{{ t }}</span>{% endfor %}
    </div>
  </div>
</div>
