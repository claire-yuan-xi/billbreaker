<div class="mt-12 border border-[#1a1a1a] bg-[#f3efe4] px-5 py-6 sm:px-8">
  <div class="text-sm font-semibold text-[#1a1a1a]">For you</div>
  {% if data.summary %}<p class="mt-3 font-serif text-xl leading-[1.5]">{{ data.summary }}</p>{% endif %}
  {% if data.points %}
  <ul class="mt-6 space-y-5">
    {% for p in data.points %}
    <li class="border-t border-[#d6d3ca] pt-4">
      <div class="text-sm font-semibold text-[#3a3a3a]">{{ p.topic }}</div>
      <div class="mt-1 font-serif text-base leading-[1.6]">{{ p.effect }}</div>
    </li>
    {% endfor %}
  </ul>
  {% endif %}
</div>
