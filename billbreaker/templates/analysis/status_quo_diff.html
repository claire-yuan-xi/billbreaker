{% if data.changes %}
<div class="mt-12">
  <div class="text-sm font-semibold text-[#3a3a3a]">Compared to current law</div>
  <ul class="mt-4 space-y-6">
    {% for c in data.changes %}
    <li class="grid grid-cols-1 gap-4 border-t border-[#d6d3ca] pt-4 sm:grid-cols-2">
      <div>
        <div class="text-sm font-semibold text-[#3a3a3a]">Today</div>
        <div class="mt-1 font-serif text-base leading-[1.6] text-[#3a3a3a]">{{ c.today }}</div>
      </div>
      <div>
        <div class="text-sm font-semibold text-[#1a1a1a]">If passed &middot; {{ c.magnitude }}</div>
        <div class="mt-1 font-serif text-base leading-[1.6]">{{ c.after }}</div>
      </div>
    </li>
    {% endfor %}
  </ul>
</div>
{% endif %}
