<div data-bill-header class="hidden">
  <div class="text-sm font-semibold text-[#3a3a3a]">
    <span data-jurisdiction></span> &middot; <span data-bill-id></span>
    <span data-cached-label class="ml-3 hidden font-serif text-[#3a7a4a]"></span>
  </div>
  <div data-cached-action role="status" class="mt-3 hidden flex-wrap items-center gap-3 border-l-2 border-[#3a7a4a] bg-[#f3efe4] py-2 pl-3 font-serif text-xs text-[#5a5650]">
    <span data-cached-text></span>
    <button type="button" data-reload class="text-[#3a3a3a] underline underline-offset-4">Retry now</button>
  </div>
  <h1 data-bill-title class="mt-5 font-serif text-5xl leading-[1.05] md:text-6xl"></h1>
  <div class="mt-6 flex flex-wrap items-center gap-x-6 gap-y-2 font-serif text-xs text-[#3a3a3a]">
    <a data-source-link target="_blank" rel="noopener noreferrer nofollow" class="hidden underline underline-offset-4">Open official source &#8599;</a>
    <span data-source-blocked role="link" aria-disabled="true" tabindex="0" class="hidden cursor-not-allowed line-through decoration-dotted opacity-55">Official source unavailable</span>
    <button type="button" data-share-link class="hidden text-xs underline-offset-4 hover:underline">Share this link</button>
    <span data-save-wrap class="hidden items-center gap-3">
      <button type="button" data-save-toggle data-press aria-pressed="false" class="relative inline-flex items-center gap-2 overflow-hidden rounded-full border border-[#bdb8ab] px-4 py-1.5 font-serif text-sm font-semibold text-[#1a1a1a] transition-colors aria-pressed:border-[#1a1a1a] aria-pressed:bg-[#1a1a1a] aria-pressed:text-[#faf8f3]">
        <svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path data-star d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
        <span data-save-label>Save bill</span>
      </button>
      <a data-saved-link href="/#saved" class="hidden text-xs text-[#7a766c] underline underline-offset-4"></a>
    </span>
    <span data-publish-wrap class="hidden items-baseline gap-3">
      <button type="button" data-publish class="text-xs underline-offset-4 hover:underline disabled:opacity-50">Publish as public page &rarr;</button>
      <a data-public-link class="hidden text-xs text-[#3a7a4a] underline underline-offset-4">Open public page &#8599;</a>
      <button type="button" data-public-copy class="hidden text-xs underline-offset-4 hover:underline">Copy link</button>
    </span>
  </div>
  <div data-source-note class="mt-3 hidden text-sm font-semibold text-[#3a3a3a]"></div>
</div>
