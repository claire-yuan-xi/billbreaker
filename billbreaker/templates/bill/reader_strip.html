{# The optional "about you" answers, shown so the reader knows what was used. #}
<div data-reader-strip class="mt-8 hidden flex-wrap items-baseline gap-x-3 gap-y-2 border-b border-t border-[#d6d3ca] py-4 font-serif text-sm">
  <span class="text-[#7a766c]">Reading this for:</span>
  <span data-reader-answers class="contents"></span>
  <button type="button" data-forget class="ml-auto text-xs text-[#3a3a3a] underline-offset-4 hover:underline">Forget my answers</button>
</div>
