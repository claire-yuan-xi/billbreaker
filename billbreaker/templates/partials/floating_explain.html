{# Keeps the explainer one tap away once the hero button has scrolled off screen. #}
<button type="button" data-floating-explain data-open-search="number" data-press class="invisible fixed bottom-5 left-1/2 z-40 flex -translate-x-1/2 items-center gap-4 overflow-hidden rounded-full bg-foreground py-3 pl-6 pr-3 text-background shadow-[0_18px_40px_-12px_rgba(0,0,0,0.55)] hover:bg-foreground/90 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-accent md:left-auto md:right-6 md:translate-x-0">
  <span class="text-[11px] font-semibold uppercase tracking-[0.25em]">Explain a bill</span>
  <span data-press-arrow aria-hidden="true" class="flex h-9 w-9 items-center justify-center rounded-full bg-accent text-foreground">&rarr;</span>
</button>
