{# Closing call to action. The drifting bill steps aside for its buttons (data-bill-avoid). #}
<section aria-labelledby="cta-title" class="border-b border-border">
  <div class="mx-auto grid max-w-6xl gap-10 px-6 py-24 md:grid-cols-12 md:items-end">
    <div class="md:col-span-7">
      <h2 id="cta-title" class="font-serif text-5xl font-bold leading-[1.02] tracking-tight md:text-7xl">Got a bill number?</h2>
    </div>
    <div data-bill-avoid class="flex flex-col gap-3 md:col-span-5">
      <button type="button" data-open-search="number" data-press="magnetic" class="group relative flex items-center justify-between overflow-hidden bg-foreground px-8 py-7 text-background">
        <span class="font-serif text-3xl font-bold">Search a bill</span>
        <span data-press-arrow aria-hidden="true" class="flex h-11 w-11 items-center justify-center rounded-full bg-accent font-bold text-foreground">&rarr;</span>
      </button>
      <button type="button" data-open-search="paste" data-press class="relative overflow-hidden border border-border px-8 py-4 text-left text-[11px] font-semibold uppercase tracking-[0.25em] hover:border-foreground">Paste text</button>
    </div>
  </div>
</section>
