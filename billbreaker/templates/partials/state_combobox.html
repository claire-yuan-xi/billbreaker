{# Searchable jurisdiction picker with keyboard navigation (search/state-combobox.js). The list opens in place, pushing the rest of the form down, so nothing can cover it. #}
<div data-combobox data-value="US">
  <button type="button" data-combobox-button aria-haspopup="listbox" aria-expanded="false" class="flex w-full items-center justify-between border border-border bg-background px-4 py-4 text-left text-base transition-colors hover:border-foreground focus:border-foreground focus:outline-none">
    <span data-combobox-label>US Federal</span>
    <span class="text-accent">&#9662;</span>
  </button>
  <div data-combobox-panel class="mt-2 hidden border border-foreground bg-background">
    <div class="border-b border-border p-2">
      <input data-combobox-filter aria-label="Filter states" placeholder="Type a state" class="w-full bg-transparent px-2 py-2 text-base outline-none placeholder:text-muted-foreground" />
    </div>
    <ul data-combobox-list role="listbox" class="max-h-72 overflow-auto overscroll-contain">
      {% for code, name in STATES %}
      <li data-code="{{ code }}" data-name="{{ name }}">
        <button type="button" role="option" class="flex w-full items-center justify-between border-b border-border/60 px-4 py-3 text-left text-base text-foreground transition-colors hover:bg-secondary data-[active=true]:bg-secondary">
          <span class="flex items-center gap-3"><span class="w-9 text-sm font-semibold text-foreground/70">{{ code }}</span><span>{{ name }}</span></span>
          <span data-selected-mark class="hidden text-sm font-semibold text-foreground/70">Selected</span>
        </button>
      </li>
      {% endfor %}
      <li data-combobox-none class="hidden px-4 py-3 text-base text-foreground/70">No matches</li>
    </ul>
  </div>
</div>
